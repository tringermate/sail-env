name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      MPLBACKEND: Agg
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e . pytest
      - run: pytest -q

  browser-parity:
    name: Browser simulator matches Python
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -e .
      - name: Export the RL policy and reference episodes from the Python simulator
        run: python tools/export_web_data.py --traces web/ref/traces.json
      - name: Replay them in the JavaScript simulator
        run: node web/check.js web/ref/traces.json
      - name: The committed page is up to date
        run: |
          node web/build.js
          git diff --exit-code web/weights.json web/index.html
