# gpu_racer_gate_20261026-154813; 2048 envs x 64 steps, 200M steps per seed, RTX 4090). 64 races vs the digital
# racer: 100% finished, paired difference -24.1 / -21.6 / -20.7 s over 684.5 s (95% CIs below -17.9 s). Part of the
# gap is the digital racer's simple gate rounding (run 1: 149 s vs 137-139 s); on the beats the racer is 3-7 s faster.
